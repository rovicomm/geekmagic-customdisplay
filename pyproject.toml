[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clockdisplay"
dynamic = ["version"]
description = "Control a GeekMagic SmallTV-Ultra display over the LAN: render and push frames, GIFs and settings."
requires-python = ">=3.10"
dependencies = ["pillow>=10.0.0", "keyring>=25", "pystray>=0.19"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
clock = "clockdisplay.cli:main"

[project.gui-scripts]
clock-tray = "clockdisplay.tray:main"

[tool.setuptools.dynamic]
version = {attr = "clockdisplay.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clockdisplay = ["assets/*.gif", "assets/zebar/*"]
