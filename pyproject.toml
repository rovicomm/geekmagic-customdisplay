[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clockdisplay"
version = "0.1.0"
description = "Control a GeekMagic SmallTV-Ultra display over the LAN: render and push frames, GIFs and settings."
requires-python = ">=3.10"
dependencies = ["pillow>=10.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clock = "clockdisplay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
